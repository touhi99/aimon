[package]
name = "aimon"
version = "0.1.0"
edition = "2021"
description = "macOS menu bar monitor for AI usage, Claude Code activity and per-process network traffic"
license = "MIT"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
chrono = "0.4"
ed25519-dalek = "3.0.0"
base64 = "0.23.1"

[profile.release]
opt-level = 3
lto = true
